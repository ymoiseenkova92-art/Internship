<!doctype html>
<!--
  ================================================================
  ШАБЛОН ЛЕНДИНГА · 8 экранов · один файл, ничего ставить не нужно
  Демо-наполнение: «Усадьбы Москвы» / KRUGOZOR Group
  Референс структуры и эффектов: j-vers.com
  ================================================================

  ЭКРАНЫ (SITE.screens, сверху вниз)
    1 hero    первый экран: крупный заголовок + анимированная сцена
    2 intro   описание и уточняющая информация
    3 stack   фото-ряд с описанием — карточки наезжают друг на друга
    4 focus   крупный заголовок, меняющееся фото и выносы-комментарии
    5 steps   шаги / этапы / даты с линией прогресса
    6 news    новости: лента едет по горизонтали при прокрутке
    7 split   дополнительная информация и крупное фото
    8 подвал  контакты, разделы, документы (SITE.footer)

  ШАПКА И БОКОВАЯ ПАНЕЛЬ
    Шапка: Усадьбы Москвы ✕ KRUGOZOR | Каталог идей.
    При прокрутке шапка получает светлую подложку во всю ширину.
    Справа — кнопка широкоформатного режима и бургер.
    Бургер открывает боковую панель: квадрат под логотип,
    под ним подпись из brand.tagline и разделы меню.
    «Наверх» — круглая кнопка в правом нижнем углу страницы.
    Линия прокрутки — вертикальная, у правого края экрана.

  ДВА ЯЗЫКА
    Любая надпись — строка "Текст" либо пара { ru:"…", en:"…" }.

  КАРТИНКИ
    Блок «КАРТИНКИ» внизу файла. Свои файлы подставляются путём:
        hero: "assets/hero.jpg"
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шаблон лендинга</title>
<meta name="description" content="">
<meta name="theme-color" content="#141110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700;800&display=swap">
<style>
/* ================================================================
   ТЕМА
   ================================================================ */
:root{
  --accent:#EF1E0F;        /* фирменный акцент */
  --accent-2:#A9140B;
  --deep-ui:#1E1B3A;       /* цвет кнопки на первом экране и цифр */

  --bg:#E9E7E3;
  --bg-2:#F4F1ED;
  --ink:#141110;
  --muted:#1411108f;
  --line:#1411102e;
  --deep:#141110;
  --on-deep:#F4F1ED;
  --dot:#14111024;
  --bar-bg:#FFFFFF;        /* подложка шапки — как у KRUGOZOR (--base) */
  --hairline:#DFE0E4;      /* линия под шапкой — как у KRUGOZOR */
  --e-bar:cubic-bezier(.22,.61,.36,1);   /* их плавность */

  /* один шрифт на весь сайт — Wix Madefor Text */
  --font-brand:'Wix Madefor Text',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-display:var(--font-brand);
  --font-sans:var(--font-brand);
  --font-mono:var(--font-brand);

  --pad:clamp(20px,5vw,64px);      /* горизонтальные поля — как у KRUGOZOR */
  --gap:clamp(10px,1.4vw,22px);
  --bar:58.5px;                    /* высота шапки: 18 + 22.5 + 18 — как у KRUGOZOR */

  --d1:clamp(28px,5.4vw,84px);
  --d2:clamp(24px,4.4vw,68px);
  --body:15px;
  --e:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --bg:#100E0D;
  --bg-2:#1A1716;
  --ink:#F2EFEB;
  --muted:#F2EFEB94;
  --line:#F2EFEB2e;
  --deep:#0A0908;
  --on-deep:#F2EFEB;
  --dot:#F2EFEB1f;
  --deep-ui:#2A2650;
  --bar-bg:#1A1716;
  --hairline:#2C2826;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 var(--body)/1.5 var(--font-sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .5s var(--e),color .5s var(--e)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4,p,figure,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.wrap{padding-inline:var(--pad)}
.mono{font:400 clamp(12px,.88vw,14px)/1.35 var(--font-sans);letter-spacing:0;text-transform:none}
.dsp{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
.d1{font-size:var(--d1)}
.d2{font-size:var(--d2)}
.lead{font-size:clamp(15px,1.15vw,20px);line-height:1.45}
/* серая точечная подложка — по всему сайту */
.dots,body,.sec{background-image:radial-gradient(var(--dot) 1.15px,transparent 1.15px);background-size:26px 26px}

/* фирменный маркер — мягкий ромб (как в написании KRUGOZOR) */
.mk{display:inline-block;width:13px;height:13px;border:1px solid currentColor;border-radius:4px;
  transform:rotate(45deg);flex:none}
.rule{position:relative;height:1px;background:var(--line)}
.rule::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  width:14px;height:14px;border:1px solid var(--line);border-radius:4px;
  background:var(--rule-bg,var(--bg))}
.sec--deep{--rule-bg:var(--deep)}
.foot{--rule-bg:var(--deep)}

/* появление */
.rv{opacity:0;transform:translateY(24px);transition:opacity .85s var(--e),transform .85s var(--e)}
.rv.in{opacity:1;transform:none}
.rv1{transition-delay:.07s}.rv2{transition-delay:.14s}.rv3{transition-delay:.21s}
.msk{display:block;overflow:hidden}
.msk>i{display:block;font-style:normal;transform:translateY(105%);transition:transform .95s var(--e)}
.msk.in>i{transform:none}

.sec{position:relative;z-index:2;background-color:var(--bg);padding-block:clamp(48px,6vw,88px)}
.sec--deep{background-color:var(--deep);color:var(--on-deep);--muted:#F2EFEB94;--line:#F2EFEB33;--dot:#F2EFEB1a}

/* ================================================================
   ШАПКА — только лого и бургер
   ================================================================ */
.top{position:fixed;inset:0 0 auto;z-index:70;display:flex;align-items:center;gap:16px;
  padding:18px var(--pad);color:var(--on-deep);
  border-bottom:1px solid transparent;
  transition:background .5s var(--e-bar),border-color .5s var(--e-bar),color .5s var(--e-bar)}
.top.light{color:var(--ink)}
/* при прокрутке — сплошная подложка и тонкая линия, как у KRUGOZOR */
.top.solid{background:var(--bar-bg);border-bottom-color:var(--hairline);color:var(--ink)}

.brand{display:flex;align-items:center;gap:clamp(7px,.7vw,11px);margin-right:auto;min-width:0}
.brand__n{font:600 clamp(12px,.94vw,15px)/1 var(--font-brand);letter-spacing:.01em;
  text-transform:uppercase;white-space:nowrap}
.brand__x{font:400 clamp(13px,1.05vw,17px)/1 var(--font-sans);opacity:.6;flex:none}
.brand__l{height:clamp(11px,.85vw,14px);width:auto;flex:none;filter:invert(1) brightness(2)}
.top.light .brand__l,.top.solid .brand__l{filter:none}
:root[data-theme="dark"] .top.light .brand__l,
:root[data-theme="dark"] .top.solid .brand__l{filter:invert(1) brightness(2)}
.brand__s{width:1px;height:13px;background:currentColor;opacity:.3;flex:none;margin-inline:clamp(2px,.3vw,5px)}
.brand__t{font:400 clamp(12px,.9vw,15px)/1 var(--font-sans);opacity:.75;white-space:nowrap}

/* кнопки справа: широкоформатный режим и бургер */
.top__act{display:flex;align-items:center;gap:clamp(6px,.7vw,12px);flex:none}
.ibtn{width:34px;height:22.5px;display:grid;place-items:center;padding:0;border:0;flex:none;
  color:currentColor;opacity:.8;transition:opacity .35s var(--e)}
.ibtn:hover{opacity:1}
.ibtn svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1}

.burger{width:34px;height:22.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;flex:none;padding:0;border:0}
.burger i{display:block;width:19px;height:1px;background:currentColor;
  transition:transform .45s var(--e),opacity .3s var(--e),width .45s var(--e)}
.burger:hover i:nth-child(2){width:12px}
body.nav-open .burger i:nth-child(1){transform:translateY(6.2px) rotate(45deg)}
body.nav-open .burger i:nth-child(2){opacity:0}
body.nav-open .burger i:nth-child(3){transform:translateY(-6.2px) rotate(-45deg)}
@media(max-width:560px){.brand__t,.brand__s{display:none}}

/* ================================================================
   БОКОВАЯ ПАНЕЛЬ
   ================================================================ */
.scrim{position:fixed;inset:0;z-index:80;background:#0a0908;opacity:0;visibility:hidden;
  transition:opacity .5s var(--e),visibility .5s}
body.nav-open{overflow:hidden}
body.nav-open .scrim{opacity:.55;visibility:visible}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(440px,100%);
  background:var(--bg-2);color:var(--ink);display:flex;flex-direction:column;
  padding:clamp(16px,2vw,28px);transform:translateX(102%);
  transition:transform .62s var(--e);overflow-y:auto}
body.nav-open .panel{transform:none}
.panel__top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:clamp(26px,4vw,48px)}
/* слева — квадрат под логотип, под ним та же подпись, что в шапке */
.panel__id{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel__logo{width:24px;height:24px;flex:none;overflow:hidden}
.panel__logo img{width:100%;height:100%;object-fit:contain}
.panel__logo.ph{border:1px dashed var(--line);border-radius:3px;display:block;font-size:0;color:transparent}
.panel__t{font:400 clamp(12px,.9vw,14px)/1.2 var(--font-sans);color:var(--muted)}
/* крестик — того же размера и веса линий, что бургер в шапке */
.panel__x{width:34px;height:24px;display:grid;place-items:center;
  padding:0;border:0;flex:none;opacity:.75;transition:opacity .3s}
.panel__x svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1}
.panel__x:hover{opacity:1}
.panel__nav{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,13px);margin-bottom:auto}
/* разделы — тем же шрифтом, что название в шапке */
.panel__nav a{font-family:var(--font-brand);font-weight:600;letter-spacing:.01em;
  text-transform:uppercase;font-size:clamp(14px,1.25vw,19px);line-height:1.3;display:block;
  transition:color .3s,transform .5s var(--e)}
.panel__nav a:hover{color:var(--accent);transform:translateX(8px)}

/* ================================================================
   1. ГЕРОЙ — чистый акцентный фон, заголовок выше, подпись под линией
   ================================================================ */
/* --run — «разбег» первого экрана: столько прокрутки он держится,
   пока текст угасает, а рисунок разрастается на весь экран */
.hero{--run:230svh;margin-bottom:var(--run);
  position:sticky;top:0;z-index:1;min-height:100svh;display:flex;flex-direction:column;
  padding:calc(var(--bar) + clamp(56px,19vh,250px)) var(--pad) clamp(18px,2.6vh,36px);
  color:#FDF6F4;overflow:hidden;isolation:isolate;
  background:linear-gradient(158deg,#F5311F 0%,var(--accent) 34%,var(--accent-2) 74%,#6E0B05 100%)}
:root[data-theme="dark"] .hero{background:linear-gradient(158deg,#C4160C 0%,#8F1008 46%,#3A0602 100%)}
.hero__ph{position:absolute;inset:0;z-index:-2;opacity:.18;mix-blend-mode:luminosity}
.hero__ph img{width:100%;height:100%;object-fit:cover}
/* Панорама: в начале — увеличенный фрагмент справа (как раньше шар),
   при прокрутке отъезжает, показывается целиком и встаёт по низу экрана. */
.hero__art{position:absolute;z-index:-1;left:0;bottom:0;width:100%;height:auto;
  transform-origin:var(--aox,60%) var(--aoy,48%);
  transform:translate(var(--ax,0px),var(--ay,0px)) scale(var(--as,1));
  opacity:var(--aop,.5);pointer-events:none;user-select:none;will-change:transform,opacity;
  /* в начале открыт только фрагмент, окно раскрывается по мере прокрутки */
  -webkit-mask-image:radial-gradient(ellipse var(--mrx,17%) var(--mry,80%) at var(--aox,60%) var(--aoy,48%),
    #000 72%, transparent 100%);
  mask-image:radial-gradient(ellipse var(--mrx,17%) var(--mry,80%) at var(--aox,60%) var(--aoy,48%),
    #000 72%, transparent 100%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* текст первого экрана угасает и слегка уходит вверх */
.hero__eye,.hero__t,.hero__foot{
  opacity:max(0, calc(1 - var(--hp,0) * 3.4));
  transform:translateY(calc(var(--hp,0) * -22vh));will-change:transform,opacity}
.hero.faded .hero__foot{pointer-events:none}
/* финал разбега: сначала знак проекта в левом верхнем углу (на уровне бургера),
   затем фирменный знак по центру экрана */
.hero__end{position:absolute;inset:0;display:grid;place-items:center;
  padding:0 var(--pad) clamp(40px,12vh,140px);pointer-events:none}
.hero__mark{width:min(46vw,560px);height:auto;opacity:var(--mop,0);
  transform:translateY(calc((1 - var(--mop,0)) * 26px));will-change:transform,opacity}
.hero__badge{position:absolute;left:var(--pad);
  top:calc(clamp(12px,1.4vw,22px) + clamp(20px,1.65vw,26px) / 2);
  height:clamp(28px,2.7vw,42px);width:auto;opacity:var(--bop,0);
  transform:translateY(calc(-50% + (1 - var(--bop,0)) * 14px));will-change:transform,opacity}
.hero::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(100deg,#5C0A04b8 0%,#5C0A0459 38%,transparent 66%)}

/* кегль заголовка считается и от ширины, и от высоты экрана */
.hero__t{max-width:16ch;text-shadow:0 2px 40px #6E0B0559;font-size:clamp(32px,6.4vw,104px)}
.hero__eye{color:#ffffffd1;margin-bottom:clamp(12px,2.2vh,30px)}
.hero__cta{background:var(--deep-ui);color:#fff;padding:clamp(16px,2.1vw,28px);min-width:min(360px,72vw);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  transition:background .4s var(--e),transform .4s var(--e)}
.hero__cta:hover{background:#141110;transform:translateY(-3px)}
.hero__cta b{font:600 clamp(13px,1vw,16px)/1 var(--font-brand);letter-spacing:.01em;text-transform:uppercase}
.hero__cta span{width:30px;height:30px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;flex:none}
.hero__foot{margin-top:auto;display:flex;align-items:flex-end;gap:20px}
.hero__cue{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:10px;color:#ffffffdb}
.hero__cue em{font-style:normal;animation:bob 2.4s var(--e) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(max-width:700px){
  .hero__foot{flex-direction:column;align-items:stretch}
  .hero__cue{margin-left:auto;align-items:center}
  /* на узком экране панорама шире экрана, иначе полоса вышла бы ниткой */
  .hero__art{width:250%;max-width:none;left:-75%}
  .hero__mark{width:min(74vw,420px)}
}

/* ================================================================
   2. ОПИСАНИЕ — наезжает на первый экран
   ================================================================ */
.intro__t{max-width:22ch;font-weight:700;text-transform:none;letter-spacing:-.035em;line-height:1.02}
.intro__rule{margin-block:clamp(26px,4vw,60px)}
.intro__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);align-items:start}
.intro__media{grid-column:1/span 5;position:relative;padding:clamp(22px,3vw,46px) 0 0 clamp(18px,2.4vw,42px)}
.intro__blob{position:relative;background:var(--accent);aspect-ratio:4/3.4}
.intro__main{position:absolute;left:9%;bottom:0;width:80%;height:104%;object-fit:cover;object-position:50% 18%}
.intro__th{position:absolute;width:clamp(64px,6.6vw,112px);aspect-ratio:1;object-fit:cover;box-shadow:0 10px 30px #00000024}
.intro__th--1{left:-6%;top:-9%}
.intro__th--2{right:-4%;top:6%}
.intro__th--3{left:-9%;bottom:-8%}
.intro__sq{position:absolute;width:clamp(20px,1.8vw,32px);aspect-ratio:1}
.intro__sq--a{background:var(--bg-2);left:14%;top:12%}
.intro__sq--b{background:var(--deep-ui);right:2%;bottom:-4%}
.intro__txt{grid-column:7/span 3}
.intro__list{grid-column:10/span 3;display:flex;flex-direction:column;gap:9px}
.intro__list li{display:flex;gap:10px}
.intro__list b{font-variant-numeric:tabular-nums;color:var(--deep-ui);font-weight:700}
:root[data-theme="dark"] .intro__list b{color:#8F86D6}
@media(max-width:900px){
  .intro__media,.intro__txt,.intro__list{grid-column:1/-1}
  .intro__txt{margin-top:24px}.intro__list{margin-top:14px}
}

/* ================================================================
   3. КАРТОЧКИ — прилипают лесенкой, шапки видны всегда
   ================================================================ */
/* стопка: один закреплённый экран, карточки выезжают снизу и встают лесенкой,
   поэтому названия видны всё время — и когда стопка уходит вверх */
.stack{position:relative;height:calc((var(--n) + .4) * 100svh);
  /* строка с названием — ровно под крупный заголовок; всё, что осталось
     от экрана, отдано высоте карточки */
  --cardw:clamp(19px,2.4vw,42px);      /* кегль названия карточки */
  --cardhead:calc(var(--cardw) * 1.7)}
.stack__pin{position:sticky;top:0;height:100svh}
.card{position:absolute;left:var(--pad);right:var(--pad);
  top:calc(var(--bar) + var(--i) * var(--cardhead));
  height:calc(100svh - var(--bar) - (var(--n) - 1) * var(--cardhead) - 2vh);
  display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);overflow:hidden;
  border:1px solid var(--line);box-shadow:0 -14px 40px #00000014;will-change:transform}
.card__l{display:grid;grid-template-rows:var(--cardhead) 1fr auto;place-items:center;text-align:center;
  padding:0 clamp(20px,3vw,52px) clamp(20px,3vw,52px)}
.card__c{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.8vw,26px);max-width:36ch}
.card__l .mk{width:8px;height:8px;border-radius:2px;background:var(--ink);border-color:var(--ink);opacity:.7}
.card__w{align-self:center;font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  letter-spacing:-.04em;line-height:1;font-size:var(--cardw,clamp(19px,2.4vw,42px))}
.card__p{color:var(--muted)}
.card__n{font-family:var(--font-display);font-weight:800;letter-spacing:-.05em;line-height:1;
  font-size:clamp(38px,5vw,88px);font-variant-numeric:tabular-nums}
.card__r{position:relative;overflow:hidden;background:#0b0908}
.card__r img{width:100%;height:100%;object-fit:cover}
.card__cap{position:absolute;left:clamp(12px,1.4vw,20px);bottom:clamp(12px,1.4vw,20px);color:#fff;
  background:#00000059;padding:7px 11px;backdrop-filter:blur(6px)}
@media(max-width:820px){
  .stack{height:auto;padding-inline:var(--pad)}
  .stack__pin{position:static;height:auto}
  .card{position:relative;left:auto;right:auto;top:auto;height:auto;transform:none!important;
    grid-template-columns:1fr;margin-bottom:14px}
  .card__l{grid-template-rows:auto auto auto;padding-block:clamp(26px,7vw,48px);gap:22px}
  .card__n{margin-top:22px}
  .card__r{aspect-ratio:4/3}
}

/* ================================================================
   4. ЗАГОЛОВОК + ФОТО С УВЕЛИЧЕНИЕМ + ВЫНОСЫ
   ================================================================ */
/* фото на всю ширину экрана: появляется из центра и увеличивается */
.zoom{position:absolute;inset:0;overflow:hidden;background:#0b0908;
  transform:scale(var(--a,.72));opacity:var(--op,0);
  transition:transform .18s linear,opacity .35s var(--e)}

   6. НОВОСТИ
   ================================================================ */
.news{position:relative}

@media(max-width:820px){

   ================================================================ */

  position:relative;overflow:hidden}
.split__l::after{content:"";position:absolute;left:-10%;top:8%;width:120%;height:56%;

  transform:rotate(-8deg);border-radius:50%}
.split__k{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1}
.split__t{margin-top:auto;position:relative;z-index:1;max-width:18ch}

.pbar{position:fixed;right:clamp(4px,.45vw,7px);top:calc(var(--bar) + 16px);bottom:clamp(74px,8vh,96px);

}

  app.querySelector(".scrim").addEventListener("click", closePanel);
  addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });

  /* «наверх» */
  upBtn.addEventListener("click", function () {
    closePanel(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });

  /* широкоформатный режим — кнопка рядом с бургером */
  var fullBtn = top.querySelector('[data-act="full"]');
  fullBtn.addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  function fsSync() {
    var on = !!document.fullscreenElement;
    fullBtn.innerHTML = on ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 1.5v4h-4M10.5 1.5v4h4M5.5 14.5v-4h-4M10.5 14.5v-4h4"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5v-4h4M14.5 5.5v-4h-4M1.5 10.5v4h4M14.5 10.5v4h-4"/></svg>';
    fullBtn.setAttribute("aria-label", T(on ? U.fullOff : U.full));
  }
  document.addEventListener("fullscreenchange", fsSync); fsSync();

  app.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener("click", function (e) {
      var t = document.querySelector(a.getAttribute("href"));
      if (!t) return;
      e.preventDefault(); closePanel();
      scrollTo({ top: t.getBoundingClientRect().top + scrollY, behavior: reduce ? "auto" : "smooth" });
    });
  });

  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -10% 0px", threshold: .1 });
  app.querySelectorAll(".rv,.msk").forEach(function (n) { io.observe(n); });
  requestAnimationFrame(function () { app.querySelectorAll(".hero .msk").forEach(function (n) { n.classList.add("in"); }); });

  /* --- прокрутка ------------------------------------------- */
  var pbar = app.querySelector(".pbar");
  var toned = [].slice.call(app.querySelectorAll("[data-tone]"));
  var focusBox = app.querySelector(".focus");
  var zoom = app.querySelector(".zoom");
  var zoomRing = app.querySelector(".zoom__ring");
  var focusCalls = [].slice.call(app.querySelectorAll(".call"));
  var focusPts = [{ x: 50, y: 50, s: 1 }].concat(
    ((C.screens || []).filter(function (s) { return s.type === "focus"; })[0] || {}).items
      ? (C.screens.filter(function (s) { return s.type === "focus"; })[0].items || []).map(function (it) {
          return { x: (it.at && it.at[0]) || 50, y: (it.at && it.at[1]) || 50, s: (it.at && it.at[2]) || 2.1 };
        })
      : []);
  var stepsLogo = app.querySelector(".steps__logo");
  var zoomImg = app.querySelector(".zoom__f img");
  var stackBox = app.querySelector(".stack");
  var stackCards = [].slice.call(app.querySelectorAll(".card"));

  /* точка на фото (в % от снимка) → точка в кадре с учётом object-fit:cover */
  function onFrame(pt, cw, ch) {
    var iw = zoomImg && zoomImg.naturalWidth, ih = zoomImg && zoomImg.naturalHeight;
    if (!iw || !ih || !cw || !ch) return pt;
    var fit = getComputedStyle(zoomImg).objectFit;
    var k = fit === "contain" ? Math.min(cw / iw, ch / ih) : Math.max(cw / iw, ch / ih);
    var dw = iw * k, dh = ih * k;
    return {
      x: Math.max(0, Math.min(100, ((pt.x / 100) * dw - (dw - cw) / 2) / cw * 100)),
      y: Math.max(0, Math.min(100, ((pt.y / 100) * dh - (dh - ch) / 2) / ch * 100)),
      s: pt.s
    };
  }
  var stepsRail = app.querySelector(".steps__rail");
  var stepsFill = app.querySelector(".steps__fill");
  var stepEls = [].slice.call(app.querySelectorAll(".step"));
  var newsBox = app.querySelector(".news");
  var newsTrack = app.querySelector(".news__track");
  var newsProg = app.querySelector(".news__prog");
  var hero = app.querySelector(".hero");
  var heroArt = app.querySelector(".hero__art");
  var raf = 0, lastFocus = -1;
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(v) { return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; }

  function frame() {
    raf = 0;
    var vh = innerHeight, doc = document.documentElement;
    pbar.style.setProperty("--p", (scrollY / Math.max(1, doc.scrollHeight - vh)).toFixed(4));

    /* тон шапки — по самой верхней перекрывающей секции (первый экран липкий) */
    var lightTone = false;
    for (var i = toned.length - 1; i >= 0; i--) {
      var r = toned[i].getBoundingClientRect();
      if (r.top <= 30 && r.bottom > 30) { lightTone = toned[i].dataset.tone === "light"; break; }
    }
    top.classList.toggle("light", lightTone);
    document.body.classList.toggle("tone-light", lightTone);
    /* подложка шапки появляется, как только страница тронулась */
    top.classList.toggle("solid", scrollY > 8);
    /* «наверх» — после первого экрана */
    upBtn.classList.toggle("on", scrollY > vh * .8);

    /* 1. первый экран — сценарий разбега:
       текст угасает → панорама отъезжает и встаёт по низу →
       появляется фирменный знак → следом «проект мэра Москвы» */
    if (hero) {
      var run = Math.max(1, parseFloat(getComputedStyle(hero).marginBottom) || vh);
      var hp = reduce ? 1 : clamp(scrollY / run);
      hero.style.setProperty("--hp", clamp(hp / .30).toFixed(4));
      hero.classList.toggle("faded", hp > .12);

      if (heroArt && heroArt.offsetWidth) {
        var W = heroArt.offsetWidth, H = heroArt.offsetHeight;
        /* доля кадра, которая показана крупным планом в начале */
        var cx = .6055, cy = .477, fw = .34;      /* ширина открытого окна = 2 × --mrx */
        var wide = innerWidth > 900;
        /* стартовый кадр — в правой верхней области экрана */
        var startW = wide ? Math.min(innerWidth * .50, vh * .80) : Math.min(innerWidth * .88, 400);
        var s0 = startW / Math.max(1, fw * W);
        var px = (wide ? .80 : .70) * innerWidth, py = (wide ? .44 : .26) * vh;
        var ox = heroArt.offsetLeft + cx * W, oy = heroArt.offsetTop + cy * H;
        var k = 1 - ease(clamp(hp / .42));            /* 1 — крупный план, 0 — целиком */
        hero.style.setProperty("--aox", (cx * 100).toFixed(2) + "%");
        hero.style.setProperty("--aoy", (cy * 100).toFixed(2) + "%");
        hero.style.setProperty("--as", (1 + (s0 - 1) * k).toFixed(3));
        hero.style.setProperty("--ax", ((px - ox) * k).toFixed(1) + "px");
        hero.style.setProperty("--ay", ((py - oy) * k).toFixed(1) + "px");
        hero.style.setProperty("--aop", (.50 + (1 - k) * .45).toFixed(3));
        hero.style.setProperty("--mrx", (17 + (1 - k) * 223).toFixed(1) + "%");
        hero.style.setProperty("--mry", (80 + (1 - k) * 220).toFixed(1) + "%");
      }
      hero.style.setProperty("--bop", ease(clamp((hp - .36) / .18)).toFixed(3));
      hero.style.setProperty("--mop", ease(clamp((hp - .60) / .2)).toFixed(3));
    }

    /* 3. стопка карточек: каждая выезжает снизу на свою ступень */
    if (stackBox && stackCards.length) {
      if (reduce || innerWidth <= 820) {
        if (stackCards[0].style.transform) stackCards.forEach(function (c) { c.style.transform = ""; });
      } else {
        var kr = stackBox.getBoundingClientRect();
        var kp = clamp(-kr.top / Math.max(1, kr.height - vh)) * stackCards.length;
        stackCards.forEach(function (c, i) {
          var loc = ease(clamp(kp - i + 1));
          var slot = c.offsetTop;
          c.style.transform = "translate3d(0," + ((1 - loc) * Math.max(0, vh - slot)).toFixed(1) + "px,0)";
        });
      }
    }

    /* 4. фото: появление из центра → увеличение на детали → выноски */
    if (focusBox && zoom) {
      var fr = focusBox.getBoundingClientRect();
      var fp = clamp(-fr.top / Math.max(1, fr.height - vh));

      var a = clamp(fp / .16);                     /* фаза появления из центра */
      zoom.style.setProperty("--a", (.7 + .3 * ease(a)).toFixed(3));
      zoom.style.setProperty("--op", a.toFixed(3));

      var segs = Math.max(1, focusPts.length - 1);
      var q = clamp((fp - .16) / .72) * segs;      /* фаза наездов на детали */
      var si = Math.min(segs - 1, Math.floor(q));
      var t = ease(clamp(q - si));
      var zw = zoom.offsetWidth, zh = zoom.offsetHeight;
      var A2 = onFrame(focusPts[si], zw, zh);
      var B2 = onFrame(focusPts[si + 1], zw, zh);
      var dip = (A2.s > 1.2 && B2.s > 1.2) ? Math.sin(Math.PI * t) * .34 : 0;
      zoom.style.setProperty("--ox", (A2.x + (B2.x - A2.x) * t).toFixed(2) + "%");
      zoom.style.setProperty("--oy", (A2.y + (B2.y - A2.y) * t).toFixed(2) + "%");
      zoom.style.setProperty("--s", (A2.s + (B2.s - A2.s) * t - dip).toFixed(3));

      var idx = t > .62 ? si : si - 1;             /* деталь «доехала» — показываем выноску */
      if (zoomRing) zoomRing.classList.toggle("on", idx >= 0);
      var vis = fr.top < vh * .5 && fr.bottom > vh * .5;
      focusCalls.forEach(function (c, j) { c.classList.toggle("on", vis && j <= idx); });
      lastFocus = idx;
    }

    /* 5. линия этапов + вращение логотипа */
    if (stepsRail && stepsFill) {
      var sr = stepsRail.getBoundingClientRect();
      var sp = clamp((vh * .55 - sr.top) / Math.max(1, sr.height));
      stepsFill.style.setProperty("--p", sp.toFixed(4));
      if (stepsLogo) stepsLogo.style.setProperty("--r", (sp * 360).toFixed(1) + "deg");
      stepEls.forEach(function (n2) { n2.classList.toggle("on", n2.getBoundingClientRect().top < vh * .6); });
    }

    /* 6. новости */
    if (newsBox && newsTrack && !reduce && innerWidth > 820) {
      var nr = newsBox.getBoundingClientRect();
      var np = clamp(-nr.top / Math.max(1, nr.height - vh));
      var travel = Math.max(0, newsTrack.scrollWidth - innerWidth);
      newsTrack.style.transform = "translate3d(" + (-np * travel).toFixed(1) + "px,0,0)";
      newsProg.style.setProperty("--p", np.toFixed(4));
    }
  }
  function onScroll() { if (!raf) raf = requestAnimationFrame(frame); }

  function sizeNews() {
    if (!newsBox || !newsTrack) return;
    if (innerWidth <= 820 || reduce) { newsBox.style.height = ""; return; }
    var travel = Math.max(0, newsTrack.scrollWidth - innerWidth);
    newsBox.style.height = (innerHeight + travel * 1.1) + "px";
  }

  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", function () { sizeNews(); onScroll(); });
  sizeNews(); frame();

  function cleanup() {
    removeEventListener("scroll", onScroll);
    io.disconnect();
    document.body.classList.remove("nav-open");
  }
}
