<!doctype html>
<!--
  ================================================================
  ШАБЛОН-КОНСТРУКТОР ЛЕНДИНГА · ЭКРАН 1
  Один файл, ничего устанавливать не нужно: откройте в браузере.

  ЧТО ГДЕ
    1. КОНФИГ  — тексты, картинки, меню. Только его и нужно править.
    2. ДВИЖОК  — сборка страницы и эффекты. Править не нужно.
    3. КАРТИНКИ — файлы, вшитые в страницу.

  ПУСТЫЕ СЛОТЫ
    Пунктирная рамка «Добавить фото» — место под изображение.
    Укажите путь в конфиге (art: "assets/photo.jpg") — рамка исчезнет.

  ШАПКА
    brand.logoBox: false — убрать квадрат под логотип.
    brand.logo: "assets/logo.svg" — подставить свой логотип.
    brand.name — название компании. Знак KRUGOZOR справа не меняется.

  ДВА ЯЗЫКА
    Любая надпись — строка "Текст" либо пара { ru:"…", en:"…" }.
    Переключатель РУС/ENG — в меню под бургером.
    Второй язык не нужен — поставьте langSwitch: false в конфиге
    и пишите обычные строки.

  ДВЕ ТЕМЫ
    colors — светлая тема, colorsDark — тёмная.
    Переключатель «Оформление» — в том же меню.
    Выбор языка и темы запоминается в браузере посетителя.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шаблон лендинга · экран 1</title>
<meta name="description" content="">
<meta name="theme-color" content="#141110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ================================================================
   ТЕМА. Базовые значения; цвета из блока colors в конфиге
   подставляются поверх них при сборке страницы.
   ================================================================ */
:root{
  --bg:#E8E8E8;            /* фон страницы */
  --bg-2:#F1F1F1;          /* фон боковой панели */
  --ink:#161616;           /* основной текст */
  --accent:#EF1E0F;        /* акцент */
  --button:#1E1B3A;        /* фон кнопки */
  --on-button:#FFFFFF;     /* текст кнопки */
  --dark:#141110;          /* фон тёмных экранов */
  --on-dark:#F2F0EE;       /* текст на тёмном */

  --muted:color-mix(in srgb, var(--ink) 58%, transparent);
  --line:color-mix(in srgb, var(--ink) 20%, transparent);
  /* осветлённый акцент — для тёмных секций и подвала */
  --accent-2:color-mix(in srgb, var(--accent) 42%, #ffffff);

  --font-display:'Unbounded',Impact,'Arial Black',sans-serif;
  --font-sans:'Manrope',-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;

  --pad:clamp(16px,3.4vw,60px);
  --bar:clamp(54px,4.6vw,76px);        /* высота шапки */
  --body:clamp(14px,1vw,18px);
  --e:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --bg:#161616;--bg-2:#1F1F1F;--ink:#F0F0F0;--button:#2A2650;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 var(--body)/1.5 var(--font-sans);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--e),color .5s var(--e)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.mono{font:500 clamp(10px,.74vw,12.5px)/1.25 var(--font-mono);letter-spacing:.13em;text-transform:uppercase}
.dsp{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.94}

/* появление блоков и строк заголовка */
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s var(--e),transform .8s var(--e)}
.rv.in{opacity:1;transform:none}

.msk{display:block;overflow:hidden}
.msk>i{display:block;font-style:normal;transform:translateY(105%);transition:transform .95s var(--e)}
.msk.in>i{transform:none}

/* ================================================================
   ПУСТЫЕ СЛОТЫ. Так выглядит место, куда подставляется картинка.
   Как только в конфиге указан файл — рамка исчезает сама.
   ================================================================ */
.ph{border:1.5px dashed currentColor;border-radius:8px;display:grid;place-items:center;
  text-align:center;padding:10px;color:var(--muted)}
.ph span{font:500 clamp(10px,.8vw,13px)/1.3 var(--font-mono);letter-spacing:.12em;
  text-transform:uppercase}

/* ================================================================
   ШАПКА: слот логотипа, название, знак KRUGOZOR, бургер
   ================================================================ */
.top{position:fixed;inset:0 0 auto;z-index:70;display:flex;align-items:center;
  padding:clamp(12px,1.4vw,22px) var(--pad);color:var(--ink);transition:color .45s var(--e)}
/* над тёмным экраном шапка переключается на светлый цвет */
.top--deep{color:var(--on-dark)}
.brand{display:flex;align-items:center;gap:clamp(8px,1vw,14px);margin-right:auto}
.brand__box{width:clamp(36px,2.6vw,42px);aspect-ratio:1;flex:none;padding:2px}
.brand__box.ph{color:currentColor;opacity:.8}
.brand__box span{font-size:clamp(7px,.55vw,9px);letter-spacing:.02em}
.brand__box img{width:100%;height:100%;object-fit:contain}
.brand__n{font:800 clamp(13px,1vw,17px)/1 var(--font-display);letter-spacing:-.04em;
  text-transform:uppercase;white-space:nowrap}
.brand__s{width:1px;height:16px;background:currentColor;opacity:.35;flex:none}
.brand__l{height:clamp(13px,1.05vw,17px);width:auto;flex:none}
:root[data-theme="dark"] .brand__l{filter:invert(1) brightness(2)}
.top--deep .brand__l{filter:invert(1) brightness(2)}
:root[data-theme="dark"] .top--deep .brand__l{filter:invert(1) brightness(2)}

.burger{width:clamp(38px,3.1vw,50px);height:clamp(20px,1.65vw,26px);display:flex;
  flex-direction:column;justify-content:space-between;flex:none;padding:0;border:0}
.burger i{display:block;width:100%;height:1.2px;background:currentColor;
  transition:transform .45s var(--e),width .45s var(--e)}
.burger:hover i:nth-child(2){width:62%}
@media(max-width:520px){.brand__s,.brand__l{display:none}}

/* ================================================================
   БОКОВАЯ ПАНЕЛЬ (бургер): меню, язык, тема, наверх, на весь экран
   ================================================================ */
.scrim{position:fixed;inset:0;z-index:80;background:#0f0f0f;opacity:0;visibility:hidden;
  transition:opacity .5s var(--e),visibility .5s}
body.nav-open{overflow:hidden}
body.nav-open .scrim{opacity:.5;visibility:visible}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(440px,100%);
  background:var(--bg-2);color:var(--ink);display:flex;flex-direction:column;
  padding:clamp(16px,2vw,28px);transform:translateX(102%);
  transition:transform .62s var(--e);overflow-y:auto}
body.nav-open .panel{transform:none}
.panel__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(20px,3vw,36px)}
.panel__x{width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.panel__nav{display:flex;flex-direction:column;gap:clamp(3px,.8vh,9px);margin-bottom:auto}
.panel__nav a{font-family:var(--font-display);font-weight:700;text-transform:uppercase;
  letter-spacing:-.03em;font-size:clamp(21px,3vw,34px);line-height:1.14;
  transition:color .3s,transform .5s var(--e);display:block}
.panel__nav a:hover{color:var(--accent);transform:translateX(8px)}
.panel__ctrls{display:flex;flex-direction:column;gap:10px;margin-top:clamp(22px,4vh,40px)}
.panel__ctrls--b{margin-top:clamp(14px,2vh,22px);padding-top:clamp(14px,2vh,22px);
  border-top:1px solid var(--line)}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid var(--line);padding:12px 14px;transition:border-color .3s;text-align:left}
.ctrl:hover{border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:6px 11px;opacity:.45;transition:opacity .3s,background .3s,color .3s}
.seg button.on{opacity:1;background:var(--ink);color:var(--bg)}

/* ================================================================
   ЭКРАН 1 — две половины: слева текст, справа крупное фото.
   Экран закреплён: следующий экран наезжает на него при прокрутке.
   ================================================================ */
.hero{position:sticky;top:0;z-index:1;min-height:100svh;display:flex;flex-direction:column;
  padding:calc(var(--bar) + clamp(24px,6vh,80px)) var(--pad) clamp(18px,2.6vh,36px);
  background:var(--hero-bg,var(--bg));color:var(--ink);overflow:hidden}

.hero__row{display:grid;grid-template-columns:1fr 1fr;align-items:start;margin-bottom:auto}
.hero__txt{min-width:0;padding-right:clamp(20px,4vw,64px)}
.hero__eye{color:var(--muted);margin-bottom:clamp(14px,2.6vh,34px)}
/* кегль в половине экрана (рядом с фото) */
.hero__t{overflow-wrap:anywhere}
.hero__t.t-l{font-size:clamp(32px,5.2vw,86px)}
.hero__t.t-m{font-size:clamp(28px,4.2vw,70px)}
.hero__t.t-s{font-size:clamp(22px,3.2vw,54px)}
/* когда фото под заголовком или его нет — текст во всю ширину */
.hero--under .hero__t.t-l,.hero--nophoto .hero__t.t-l,.hero--center .hero__t.t-l{font-size:clamp(40px,7.6vw,120px)}
.hero--under .hero__t.t-m,.hero--nophoto .hero__t.t-m,.hero--center .hero__t.t-m{font-size:clamp(34px,5.6vw,92px)}
.hero--under .hero__t.t-s,.hero--nophoto .hero__t.t-s,.hero--center .hero__t.t-s{font-size:clamp(26px,4vw,66px)}
/* фото: от середины экрана до правого поля */
.hero__slot{width:100%;height:clamp(240px,min(62vh,42vw),620px);border-radius:10px;
  overflow:hidden;background:color-mix(in srgb, var(--ink) 6%, transparent)}
.hero__slot img{width:100%;height:100%;object-fit:cover}
/* фото под заголовком */
.hero--under .hero__row{grid-template-columns:minmax(0,1fr)}
.hero--under .hero__txt{padding-right:0}
.hero--under .hero__slot{margin-top:clamp(20px,3.4vh,44px);height:clamp(220px,40vh,420px)}
.hero--nophoto .hero__slot{display:none}
.hero--center .hero__row{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.hero--center .hero__txt{padding-right:0}
.hero--center .hero__slot{margin-top:clamp(20px,3.4vh,44px);max-width:min(900px,100%);height:clamp(220px,40vh,420px)}

.hero__foot{display:flex;align-items:flex-end;gap:20px;padding-top:clamp(20px,4vh,52px)}
.hero__cta{background:var(--button);color:var(--on-button);padding:clamp(16px,2.1vw,28px);
  min-width:min(360px,72vw);border-radius:2px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  transition:background .4s var(--e),transform .4s var(--e)}
.hero__cta:hover{transform:translateY(-3px)}
.hero__cta b{font:700 clamp(12px,.95vw,15px)/1 var(--font-mono);letter-spacing:.11em;text-transform:uppercase}
.hero__cta span{width:30px;height:30px;border-radius:50%;
  background:color-mix(in srgb, var(--on-button) 18%, transparent);
  display:grid;place-items:center;flex:none}
.hero__cue{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted)}
.hero__cue em{font-style:normal;animation:bob 2.4s var(--e) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

@media(max-width:820px){
  .hero__row{grid-template-columns:minmax(0,1fr)}
  .hero__txt{padding-right:0}
  .hero__t.t-l{font-size:clamp(40px,10vw,90px)}
  .hero__t.t-m{font-size:clamp(34px,8.4vw,76px)}
  .hero__t.t-s{font-size:clamp(26px,6.6vw,60px)}
  .hero__slot{margin-top:clamp(18px,3vh,32px);height:clamp(220px,38vh,380px)}
}
@media(max-width:700px){
  .hero__foot{flex-direction:column;align-items:stretch}
  .hero__cue{margin-left:auto}
}


/* ================================================================
   ЭКРАН 2 — описание и уточняющая информация.
   Наезжает на первый экран: он выше по слою, с мягкой тенью.
   ================================================================ */
.sec{position:relative;z-index:2;background-color:var(--sec-bg,var(--bg));color:var(--ink);
  padding-block:clamp(56px,9vw,140px);
  box-shadow:0 -24px 60px color-mix(in srgb, var(--ink) 12%, transparent)}
/* тёмный экран: цвета текста и линий переворачиваются,
   точки автоматически становятся светлыми */
.sec--dark{--bg:var(--dark);
  --bg-2:color-mix(in srgb, var(--dark) 86%, #ffffff);
  --ink:var(--on-dark);
  --muted:color-mix(in srgb, var(--on-dark) 62%, transparent);
  --line:color-mix(in srgb, var(--on-dark) 26%, transparent);
  background-color:var(--sec-bg,var(--bg));color:var(--ink)}
/* точечная подложка: включается полем dots: true в конфиге экрана */
.sec--dots{background-image:radial-gradient(
    color-mix(in srgb, var(--ink) 16%, transparent) 1.15px, transparent 1.15px);
  background-size:26px 26px}
.wrap{padding-inline:var(--pad)}
/* линия с ромбом по центру — общий декоративный элемент */
.rule{position:relative;height:1px;background:var(--line);margin-block:clamp(26px,4.4vw,64px)}
.rule::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  width:14px;height:14px;border:1px solid var(--line);border-radius:4px;
  background:var(--sec-bg,var(--bg))}

.about__t{max-width:24ch;font-size:clamp(26px,3.6vw,60px);line-height:1.04;
  text-transform:none;letter-spacing:-.03em;font-weight:700}
.about__grid{display:grid;grid-template-columns:4.4fr 3.6fr 3fr;
  gap:clamp(20px,3vw,56px);align-items:start}

/* фото с подложкой, маленькими снимками и декоративными квадратами */
.about__media{position:relative;max-width:min(100%,560px);
  padding:clamp(22px,3vw,46px) 0 0 clamp(18px,2.4vw,42px)}
.about__blob{position:relative;background:var(--blob,var(--button));aspect-ratio:4/3.4;border-radius:4px}
.about__blob--off{background:transparent}
.about__main{position:absolute;left:9%;bottom:0;width:80%;height:104%;overflow:hidden;border-radius:4px;
  background:color-mix(in srgb, var(--ink) 8%, transparent)}
.about__main img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.about__main.ph{color:#fff;background:transparent}
.about__blob--off .about__main.ph{color:var(--muted)}
.about__th{position:absolute;width:clamp(64px,6.6vw,112px);aspect-ratio:1;border-radius:3px;
  overflow:hidden;background:var(--bg-2);box-shadow:0 10px 30px #00000024}
.about__th img{width:100%;height:100%;object-fit:cover}
.about__th.ph{color:var(--muted)}
.about__th.ph span{font-size:clamp(8px,.62vw,10px);letter-spacing:.08em}
.about__th--1{left:-6%;top:-9%}
.about__th--2{right:-4%;top:6%}
.about__th--3{left:-9%;bottom:-8%}
/* декоративные квадраты */
.about__sq{position:absolute;width:clamp(20px,1.8vw,32px);aspect-ratio:1;border-radius:2px}
.about__sq--a{background:var(--bg-2);right:3.5%;top:13%}
.about__sq--b{background:var(--button);right:2%;bottom:-4%}

.about__txt{color:var(--muted);font-size:clamp(14px,1.05vw,19px);line-height:1.5;max-width:62ch}
.about__txt p+p{margin-top:1em}
.about__list{display:flex;flex-direction:column;gap:clamp(9px,1.2vw,16px)}
.about__list li{display:flex;gap:12px;align-items:baseline}
.about__list b{font-variant-numeric:tabular-nums;color:var(--blob,var(--button));font-weight:700;flex:none}
/* в тёмной теме цифры подсветляем, иначе тон кнопки сливается с фоном */
:root[data-theme="dark"] .about__list b{
  color:color-mix(in srgb, var(--blob,var(--button)) 42%, var(--ink))}

/* список убран — текст занимает ширину обоих блоков */
.about--nolist .about__grid{grid-template-columns:4.4fr 6.6fr}

@media(max-width:1000px){
  .about__grid,.about--nolist .about__grid{grid-template-columns:1fr 1fr}
  .about__media{grid-column:1/-1;max-width:640px}
  .about__t{max-width:100%}
}
@media(max-width:700px){
  .about__grid{grid-template-columns:1fr}
  .about__media{max-width:100%}
  .about__th{width:clamp(56px,15vw,92px)}
  .about__th--1{left:-2%}
  .about__th--2{right:-2%}
}


/* ================================================================
   ЭКРАН 3 — карточки с фото и описанием.
   Экран закрепляется один раз, карточки по очереди выезжают снизу
   и встают лесенкой: названия всех карточек видны всё время.
   --cardw — кегль названия, от него считается высота видимой строки.
   ================================================================ */
.stack{position:relative;z-index:2;background-color:var(--sec-bg,var(--bg));
  --cardw:clamp(19px,2.4vw,42px);
  --cardhead:calc(var(--cardw) * 1.7);
  height:calc((var(--n) + .4) * 100svh)}
.stack__pin{position:sticky;top:0;height:100svh}
.card{position:absolute;left:var(--pad);right:var(--pad);
  top:calc(var(--bar) + var(--i) * var(--cardhead));
  height:calc(100svh - var(--bar) - (var(--n) - 1) * var(--cardhead) - 2vh);
  display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);overflow:hidden;
  border:1px solid var(--line);border-radius:6px;
  box-shadow:0 -14px 40px color-mix(in srgb, var(--ink) 10%, transparent);
  will-change:transform}
.card__l{display:grid;grid-template-rows:var(--cardhead) 1fr auto;place-items:center;
  text-align:center;padding:0 clamp(18px,2.6vw,44px) clamp(18px,2.6vw,44px)}
.card__c{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.8vw,26px);max-width:36ch}
.card__w{align-self:center;font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  letter-spacing:-.04em;line-height:1;font-size:var(--cardw)}
.card__p{color:var(--muted)}
.card__n{font-family:var(--font-display);font-weight:800;letter-spacing:-.05em;line-height:1;
  font-size:clamp(38px,5vw,88px);font-variant-numeric:tabular-nums}
/* маркер — залитый мягкий ромб */
.card__mk{width:8px;height:8px;border-radius:2px;background:var(--ink);opacity:.7;
  transform:rotate(45deg);flex:none}
.card__r{position:relative;overflow:hidden;background:color-mix(in srgb, var(--ink) 8%, transparent)}
.card__r img{width:100%;height:100%;object-fit:cover}
.card__r.ph{border:0;border-left:1.5px dashed var(--line);border-radius:0}
.card__cap{position:absolute;left:clamp(12px,1.4vw,20px);bottom:clamp(12px,1.4vw,20px);color:#fff;
  background:#00000059;padding:7px 11px;border-radius:3px;backdrop-filter:blur(6px)}

@media(max-width:820px){
  .stack{height:auto;padding:clamp(40px,8vw,90px) var(--pad)}
  .stack__pin{position:static;height:auto}
  .card{position:relative;left:auto;right:auto;top:auto;height:auto;transform:none!important;
    grid-template-columns:1fr;margin-bottom:14px}
  .card__l{grid-template-rows:auto auto auto;padding-block:clamp(26px,7vw,48px);gap:20px}
  .card__n{margin-top:20px}
  .card__r{aspect-ratio:4/3}
  .card__r.ph{border:0;border-top:1.5px dashed var(--line)}
}


/* ================================================================
   ЭКРАН 4 — крупный заголовок и фото с выносками.
   Фото закрепляется, при прокрутке наезжает на выбранные детали,
   и по очереди появляются выноски с текстом.
   ================================================================ */
.focus-sec{position:relative;z-index:2;background-color:var(--sec-bg,var(--bg));
  padding-top:clamp(56px,9vw,140px);padding-bottom:0}
.focus__head{text-align:center;display:flex;flex-direction:column;align-items:center;
  gap:clamp(10px,1.4vw,18px)}
.focus__head h2{font-size:clamp(30px,5.4vw,92px)}
.focus__sub{color:var(--muted);max-width:38ch;font-size:clamp(14px,1.05vw,19px)}
.focus{position:relative}
.focus__stage{position:sticky;top:0;height:100svh;display:grid;place-items:center;overflow:hidden}

/* кадр с фото */
.zoom{position:absolute;inset:0;overflow:hidden;
  background:color-mix(in srgb, var(--ink) 8%, transparent);
  transform:scale(var(--a,.86));opacity:var(--op,0);
  transition:transform .18s linear,opacity .35s var(--e)}
.zoom__f{position:absolute;inset:0;transform:scale(var(--s,1));
  transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .22s linear}
.zoom__f img{width:100%;height:100%;object-fit:cover}
.zoom.ph{transform:none;opacity:1;background:transparent;
  inset:clamp(16px,3vw,60px);border-radius:8px;border:1.5px dashed var(--line);
  display:grid;place-items:center;color:var(--muted)}
.zoom.ph span{font:500 clamp(10px,.8vw,13px)/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
/* кружок на детали и затемнение вокруг */
.zoom__ring{position:absolute;width:clamp(92px,12vw,210px);aspect-ratio:1;border:1px solid #ffffffd1;
  border-radius:50%;left:var(--ox,50%);top:var(--oy,50%);transform:translate(-50%,-50%);
  opacity:0;transition:opacity .5s var(--e);box-shadow:0 0 0 200vw #0a0908a3}
.zoom__ring.on{opacity:1}

/* выноски: номер, тонкая линия и текст */
.call{position:absolute;z-index:2;width:min(320px,30vw);opacity:0;transform:translateY(14px);
  transition:opacity .7s var(--e),transform .7s var(--e);color:var(--ink)}
.focus--photo .call{color:#fff;text-shadow:0 2px 22px #0a0908cc}
.focus-sec.sec--dark .call{color:var(--ink)}
.focus-sec.sec--dark .focus--photo .call{color:#fff}
.call.on{opacity:1;transform:none}
.call__h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.call__n{width:30px;height:30px;border-radius:50%;border:1px solid currentColor;
  display:grid;place-items:center;font:600 12px/1 var(--font-mono);flex:none}
.call__l{flex:1 1 auto;height:1px;background:currentColor;opacity:.45;transform:scaleX(0);
  transform-origin:var(--o,100% 50%);transition:transform .8s var(--e) .15s}
.call.on .call__l{transform:none}
.call h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;
  line-height:1.02;font-size:clamp(16px,1.75vw,29px)}
.call p{margin-top:9px;opacity:.85}
.call--1{right:clamp(24px,5vw,90px);top:13%;text-align:right}
.call--1 .call__h{flex-direction:row-reverse}
.call--2{left:clamp(24px,5vw,90px);top:45%;--o:0% 50%}
.call--3{right:clamp(24px,5vw,90px);bottom:12%;text-align:right}
.call--3 .call__h{flex-direction:row-reverse}
.call--4{left:clamp(24px,5vw,90px);bottom:12%;--o:0% 50%}

@media(max-width:900px){
  .call{width:min(300px,74vw);left:calc(var(--pad) + 14px);right:auto;text-align:left;--o:0% 50%}
  .call--1 .call__h,.call--3 .call__h{flex-direction:row}
  .call--1{top:6%}.call--2{top:auto;bottom:30%}.call--3{bottom:6%;text-align:left}
  .call--4{bottom:6%}
  .zoom__ring{width:clamp(70px,19vw,110px)}
  .zoom__f img{object-fit:contain}
}

/* ================================================================
   ЭКРАН 5 — этапы. Слева знак, он поворачивается при прокрутке,
   справа линия с точками: закрашивается акцентным цветом,
   шаги проявляются по очереди.
   ================================================================ */
.steps__head{text-align:center}
.steps__head h2{font-size:clamp(28px,5vw,84px)}
.steps__grid{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(20px,4vw,80px);align-items:start}
.steps--nomark .steps__grid{grid-template-columns:1fr}
/* знак: «название компании & KRUGOZOR» акцентным цветом */
.steps__art{position:sticky;top:calc(var(--bar) + 4vh);display:grid;place-items:center;
  height:min(62vh,600px)}
.steps__logo{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.1vw,16px);
  color:var(--accent);transform:rotate(var(--r,0deg));transition:transform .18s linear;will-change:transform}
.steps__logo b{font:800 clamp(20px,2.4vw,40px)/.96 var(--font-display);text-transform:uppercase;
  letter-spacing:-.045em;text-align:center}
.steps__logo i{font:400 clamp(16px,1.8vw,30px)/1 var(--font-display);font-style:normal;opacity:.6}
.steps__logo u{display:block;text-decoration:none;width:clamp(130px,14vw,230px);aspect-ratio:460/87;
  background:var(--ink);-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
/* вертикальная линия со шкалой прохождения */
.steps__rail{position:relative;padding-left:clamp(30px,3.4vw,58px)}
.steps__rail::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.steps__fill{position:absolute;left:0;top:6px;width:1px;background:var(--accent);
  height:calc(var(--p,0) * (100% - 12px));transition:height .12s linear}
.steps__list{display:flex;flex-direction:column;gap:clamp(38px,6vw,104px)}
.step{position:relative}
.step__dot{position:absolute;left:calc(-1 * clamp(30px,3.4vw,58px));top:5px;width:11px;height:11px;
  border-radius:50%;background:var(--sec-bg,var(--bg));border:1px solid var(--line);transform:translateX(-5px);
  transition:background .4s,border-color .4s}
.step.on .step__dot{background:var(--accent);border-color:var(--accent)}
.step__n{color:var(--muted);margin-bottom:clamp(14px,2vw,32px)}
.step h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;
  line-height:1.02;font-size:clamp(19px,2.2vw,36px)}
.step p{margin-top:12px;color:var(--muted);max-width:44ch}
@media(max-width:900px){
  .steps__grid{grid-template-columns:1fr}
  .steps__art{position:relative;top:auto;height:min(42vh,320px);margin-bottom:18px}
  .steps__logo u{width:40vw}
  .steps__logo b{font-size:clamp(18px,5vw,28px)}
  .steps__list{gap:42px}
}

/* ================================================================
   ЭКРАН 6 — горизонтальная лента карточек.
   Экран закрепляется, прокрутка страницы двигает карточки вбок,
   внизу — шкала пройденного пути акцентным цветом.
   ================================================================ */
.news{position:relative}
.news__pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;gap:clamp(16px,2.4vw,36px)}
.news__bar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-inline:var(--pad)}
.news__bar h2{font-size:clamp(24px,3.4vw,58px)}
.news__note{color:var(--muted);max-width:34ch}
.news__track{display:flex;gap:clamp(14px,1.8vw,30px);padding-inline:var(--pad);will-change:transform}
.news__item{flex:0 0 clamp(260px,38vw,560px);display:flex;flex-direction:column}
.news__item figure{margin:0;overflow:hidden;background:color-mix(in srgb, var(--ink) 8%, transparent)}
.news__item figure.ph{aspect-ratio:16/10;border-radius:8px;background:transparent}
.news__item img{width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform 1s var(--e)}
.news__item:hover img{transform:scale(1.05)}
.news__meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;color:var(--muted)}
.news__item h3{margin-top:9px;font:600 clamp(16px,1.4vw,24px)/1.18 var(--font-sans);letter-spacing:-.025em}
.news__item p{margin-top:8px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news__prog{height:1px;background:var(--line);margin-inline:var(--pad);position:relative}
.news__prog i{position:absolute;left:0;top:0;height:100%;width:calc(var(--p,0)*100%);
  background:var(--accent);display:block}
@media(max-width:820px){
  .news__pin{position:relative;height:auto;padding-block:clamp(40px,8vw,80px)}
  .news__track{overflow-x:auto;scroll-snap-type:x mandatory;transform:none!important;scrollbar-width:none}
  .news__track::-webkit-scrollbar{display:none}
  .news__item{flex-basis:80vw;scroll-snap-align:start}
  .news__bar{flex-direction:column;align-items:flex-start;gap:10px}
}

/* ================================================================
   ПОДВАЛ — «Связаться». Фон в цвет кнопки, точечная подложка,
   крупные ссылки для связи, колонки со ссылками и нижняя строка.
   ================================================================ */
.foot{position:relative;z-index:2;background-color:var(--foot-bg,var(--button));color:var(--on-button);
  --ink:var(--on-button);
  --muted:color-mix(in srgb, var(--on-button) 56%, transparent);
  --line:color-mix(in srgb, var(--on-button) 18%, transparent);
  --sec-bg:var(--foot-bg,var(--button));
  background-image:radial-gradient(color-mix(in srgb, var(--on-button) 9%, transparent) 1.15px,transparent 1.15px);
  background-size:26px 26px}
.foot__top{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,3vw,56px);align-items:start;
  padding-block:clamp(46px,6.5vw,110px)}
.foot__top h2{font-size:clamp(30px,5.4vw,92px)}
.foot__links{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,20px);align-items:flex-start}
.foot__link{font-family:var(--font-display);font-weight:700;letter-spacing:-.035em;
  font-size:clamp(18px,2.3vw,40px);line-height:1.06;display:inline-flex;align-items:center;gap:14px;
  transition:color .35s var(--e),gap .35s var(--e)}
.foot__link:hover{color:var(--accent-2);gap:22px}
.foot__link i{font-style:normal;font-size:.5em;opacity:.6}
.foot__mid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(18px,2vw,34px) var(--gap);
  padding-bottom:clamp(34px,5vw,80px)}
.foot__mid>*:nth-child(1){grid-column:1/span 3}
.foot__mid>*:nth-child(2){grid-column:5/span 3}
.foot__mid>*:nth-child(3){grid-column:10/span 3}
.foot__c h4{color:var(--muted);margin-bottom:14px}
.foot__c li+li{margin-top:9px}
.foot__c a{position:relative}
.foot__c a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;
  background:currentColor;transition:right .5s var(--e)}
.foot__c a:hover::after{right:0}
.foot__addr{color:var(--muted)}
.foot__bot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;border-top:1px solid var(--line);
  padding-block:clamp(14px,1.8vw,26px)}
.foot__bot .sp{margin-left:auto}
.foot__logo{display:flex;align-items:center;gap:9px}
.foot__logo img{height:16px}
@media(max-width:900px){
  .foot__top{grid-template-columns:1fr}
  .foot__mid>*:nth-child(1),.foot__mid>*:nth-child(2),.foot__mid>*:nth-child(3){grid-column:span 6}
}
@media(max-width:600px){
  .foot__mid>*:nth-child(1),.foot__mid>*:nth-child(2),.foot__mid>*:nth-child(3){grid-column:1/-1}
}

/* ================================================================
   ЗАГЛУШКА СЛЕДУЮЩЕГО ЭКРАНА (временная)
   ================================================================ */
.next{position:relative;z-index:2;background:var(--bg);
  min-height:100svh;display:grid;place-items:center;padding:clamp(40px,8vw,120px) var(--pad);
  box-shadow:0 -24px 60px color-mix(in srgb, var(--ink) 12%, transparent)}
.next__box{width:100%;max-width:900px;min-height:clamp(180px,28vh,300px);
  border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.next__box b{font:800 clamp(22px,3vw,44px)/1 var(--font-display);letter-spacing:-.03em;
  text-transform:uppercase;color:var(--ink)}

.pbar{position:fixed;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;
  transform:scaleX(var(--p,0));background:var(--accent);z-index:100;
  transition:background .35s var(--e)}
body.tone-deep .pbar{background:var(--accent-2)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  .msk>i{transform:none}
}

</style>

<body>
<div id="app"></div>

<!-- ===== 1. КОНФИГ: тут собирается экран ===== -->
<script>
/* ================================================================
   КОНСТРУКТОР ЛЕНДИНГА
   Всё, что нужно менять, находится здесь.

   • Любая надпись — строка "Текст" либо пара языков { ru:"…", en:"…" }.
     Пара нужна, если в меню оставлен переключатель языка:
     при переключении на ENG показывается en, иначе — ru.
     Если второй язык не нужен — поставьте langSwitch: false
     и пишите обычные строки.
   • Картинки: "" — пустой слот (пунктирная рамка «Добавить фото»);
     свой файл — путь: "assets/photo.jpg" либо ключ из блока
     КАРТИНКИ внизу файла.
   ================================================================ */
window.SITE = {

  lang: "ru",              /* язык по умолчанию: ru | en */
  langSwitch: true,        /* false — убрать переключатель языка из меню */
  theme: "light",          /* оформление по умолчанию: light | dark */

  meta: {
    title: { ru: "Шаблон лендинга", en: "Landing template" },
    description: { ru: "Конструктор лендинга.", en: "Landing page builder." }
  },

  /* ================= ЦВЕТА ================= */
  /* Два набора: светлая тема и тёмная (переключатель в меню).
     Можно писать любой цвет: "#E8E8E8", "rgb(...)", "hsl(...)". */
  colors: {
    bg:     "#E8E8E8",     /* фон страницы и первого экрана */
    bg2:    "#F1F1F1",     /* фон карточек и боковой панели */
    ink:    "#161616",     /* основной текст */
    accent: "#1E1B3A",     /* акцент: линия прокрутки, заливка этапов,
                              знак на 5-м экране, наведение.
                              По умолчанию — в тон кнопке. */
    button: "#1E1B3A",     /* фон кнопки и подвала */
    onButton: "#FFFFFF",   /* текст на кнопке и в подвале */
    dark:   "#141110",     /* фон тёмных экранов */
    onDark: "#F2F0EE"      /* текст на тёмном */
  },

  /* тёмная тема: те же поля, свои значения.
     Текст здесь светлый, фон тёмный — иначе надписи пропадут. */
  colorsDark: {
    bg:     "#141414",
    bg2:    "#1E1E1E",
    ink:    "#F0EFEC",
    accent: "#8E86D6",   /* тот же тон кнопки, но светлее — на тёмном фоне */
    button: "#2E2A57",
    onButton: "#FFFFFF",
    dark:   "#0D0B0B",
    onDark: "#F2F0EE"
  },

  /* ================= ШАПКА ================= */
  brand: {
    logoBox: true,                 /* false — убрать квадрат под логотип */
    logo: "",                      /* путь к логотипу; "" — пустой слот */
    logoLabel: { ru: "ЛОГО", en: "LOGO" },             /* подпись внутри пустого слота */
    name: { ru: "Название компании", en: "Company name" },     /* "" — убрать название */
    partner: "logo",               /* знак KRUGOZOR справа; "" — убрать */
    partnerAlt: "KRUGOZOR"
  },

  /* МЕНЮ (открывается бургером) */
  nav: [
    { label: { ru: "Раздел 1", en: "Section 1" }, href: "#s2" },
    { label: { ru: "Раздел 2", en: "Section 2" }, href: "#s3" },
    { label: { ru: "Раздел 3", en: "Section 3" }, href: "#s4" },
    { label: { ru: "Раздел 4", en: "Section 4" }, href: "#s5" },
    { label: { ru: "Контакты", en: "Contacts" }, href: "#contact" }
  ],

  /* подписи боковой панели */
  ui: {
    menu:   { ru: "Меню", en: "Menu" },
    lang:   { ru: "Язык", en: "Language" },
    theme:  { ru: "Оформление", en: "Appearance" },
    light:  { ru: "Светлое", en: "Light" },
    dark:   { ru: "Тёмное", en: "Dark" },
    top:    { ru: "Наверх", en: "To top" },
    topGo:  { ru: "Перейти", en: "Go" },
    full:   { ru: "На весь экран", en: "Fullscreen" },
    fullOn: { ru: "Включить", en: "Enter" },
    fullOff:{ ru: "Выключить", en: "Exit" }
  },

  /* ================= ЭКРАН 1 =================
     Экран делится пополам: слева подзаголовок и заголовок,
     справа крупное фото — от середины экрана до правого поля.
     Подзаголовок стоит по верхней границе фото.
     ============================================ */
  screens: [
    {
      type: "hero",
      id: "top",

      bg: "",                      /* свой фон только у этого экрана;
                                      "" — общий фон страницы (colors.bg) */

      eyebrow: { ru: "Подзаголовок", en: "Subheading" },     /* строка над заголовком */
      /* заголовок: строка или массив — каждый элемент отдельной строкой */
      title: { ru: ["Заголовок"], en: ["Heading"] },

      /* --- ЗАГОЛОВОК: кегль и выравнивание ------------------------
         titleSize:  "auto" — кегль подбирается по длине заголовка,
                     либо вручную: "l" (крупный), "m", "s" (мелкий).
         titleAlign: "left" | "center". */
      titleSize: "auto",
      titleAlign: "left",

      /* --- ФОТО ---------------------------------------------------
         photoMode: "side"  — половина экрана справа (по умолчанию);
                    "under" — под заголовком во всю ширину;
                    "off"   — убрать фото;
                    "auto"  — короткий заголовок: справа,
                              длинный: под заголовком.
         photoAutoAt — граница для "auto": сколько знаков в самой
                       длинной строке заголовка ещё считается коротким. */
      photo: "",
      photoLabel: { ru: "Добавить фото", en: "Add photo" },
      photoMode: "side",
      photoAutoAt: 14,

      cta: { label: { ru: "Кнопка", en: "Button" }, href: "#s2" },
      cue: { ru: "Листайте вниз", en: "Scroll down" }
    },

    /* ================= ЭКРАН 2 =================
       Описание и уточняющая информация: заголовок, линия,
       фото с подложкой и маленькими снимками, текст и список.
       ============================================ */
    {
      type: "about",
      id: "s2",

      bg: "",                      /* свой фон экрана; "" — общий */
      dots: true,                  /* точечная подложка: true | false */
      title: { ru: "Заголовок второго экрана: короткая мысль в одну-две строки",
               en: "Second screen heading: one short thought in a line or two" },

      /* текст: строка или массив — каждый элемент отдельным абзацем */
      text: {
        ru: ["Абзац с описанием. Здесь коротко о компании, проекте или предложении — два-три предложения, которые поясняют заголовок.",
             "Второй абзац, если нужен."],
        en: ["A descriptive paragraph. A few sentences about the company, the project or the offer that explain the heading.",
             "A second paragraph, if needed."]
      },

      /* нумерованный список: 01, 02, 03 — нумерация проставляется сама.
         list: [] — убрать список, тогда текст занимает ширину обоих блоков */
      list: { ru: ["Пункт списка", "Второй пункт", "Третий пункт"],
              en: ["List item", "Second item", "Third item"] },

      /* фото: крупное и до трёх маленьких поверх него.
         thumbs: [] — убрать маленькие снимки.
         accentBox: false — убрать цветную подложку.
         accentColor — цвет подложки и цифр списка;
         "" — берётся цвет кнопки (colors.button). */
      photo: "",
      photoLabel: { ru: "Добавить фото", en: "Add photo" },
      thumbs: ["", "", ""],
      thumbLabel: { ru: "Фото", en: "Photo" },
      accentBox: true,
      accentColor: "",
      decor: true                  /* маленькие декоративные квадраты */
    },

<script>

      return v[LANG] !== undefined ? v[LANG] : v.ru;
    return v;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* внешние ссылки открываем в новой вкладке */
  function ext(h) { return /^https?:/.test(h || "") ? ' target="_blank" rel="noopener"' : ""; }

  function lines(v) { var x = T(v); return Array.isArray(x) ? x : [x]; }

  /* ================================================================
     ЭКРАН 1
     ================================================================ */
  var S = {};

    var mark = "";
    if (s.mark !== false) {
      var nm = esc(T(b.name) || "");

  };

  /* ЭКРАН 6 — горизонтальная лента карточек */
  S.news = function (s) {
    var items = s.items || [];
    var it = items.map(function (n, i) {
      var tag = n.tag !== undefined ? T(n.tag) : String(i + 1).padStart(2, "0");
      return '<article class="news__item">' +
        (n.photo
          ? '<figure><img src="' + esc(IMG(n.photo)) + '" alt=""></figure>'
          : '<figure class="ph"><span>' + (esc(T(s.photoLabel)) || "Добавить фото") + "</span></figure>") +
        '<div class="news__meta mono"><span>' + esc(T(n.date) || "") + "</span>" +
          "<span>" + esc(tag || "") + "</span></div>" +
        "<h3>" + esc(T(n.title)) + "</h3>" +
        (T(n.text) ? "<p>" + esc(T(n.text)) + "</p>" : "") +
      "</article>";
    }).join("");

    return el(
      '<section class="sec news' + (s.dots === false ? "" : " sec--dots") +
        '" id="' + esc(s.id || "") + '" data-tone="light" style="padding:0' +
        (s.bg ? ";--sec-bg:" + esc(s.bg) : "") + '">' +
        '<div class="news__pin">' +
          '<div class="news__bar"><h2 class="dsp rv">' + esc(T(s.title)) + "</h2>" +
            (T(s.note) ? '<div class="news__note mono rv">' + esc(T(s.note)) + "</div>" : "") +
          "</div>" +
          '<div class="news__track">' + it + "</div>" +
          '<div class="news__prog"><i></i></div>' +
        "</div>" +
      "</section>"
    );
  };

  /* ================================================================
     СБОРКА
     ================================================================ */
  /* цвета из конфига: два набора — светлая и тёмная тема.
     Подставляем их отдельным стилем, чтобы переключатель темы
     в меню действительно менял палитру. */
  var CMAP = { bg: "--bg", bg2: "--bg-2", ink: "--ink", accent: "--accent",
    button: "--button", onButton: "--on-button", dark: "--dark", onDark: "--on-dark" };
  function palette(o) {
    var out = "";
    for (var k in CMAP) if (o && o[k]) out += CMAP[k] + ":" + o[k] + ";";
    return out;
  }
  var pal = document.getElementById("palette");
  if (!pal) { pal = document.createElement("style"); pal.id = "palette"; document.head.appendChild(pal); }
  pal.textContent = ":root{" + palette(C.colors) + "}\n" +
    ':root[data-theme="dark"]{' + palette(C.colorsDark) + "}";

  document.documentElement.lang = LANG;
  document.documentElement.dataset.theme = THEME;
  if (C.meta) {
    document.title = T(C.meta.title) || document.title;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", T(C.meta.description) || "");
  }
  app.innerHTML = "";
  app.appendChild(el('<div class="pbar" aria-hidden="true"></div>'));

  /* шапка */
  var b = C.brand || {};
  var top = el(
    '<header class="top">' +
      '<a class="brand" href="#top">' +
        (b.logoBox
          ? (b.logo
              ? '<span class="brand__box"><img src="' + esc(IMG(b.logo)) + '" alt=""></span>'
              : '<span class="brand__box ph"><span>' + esc(T(b.logoLabel) || "ЛОГО") + "</span></span>")
          : "") +
        (b.name ? '<span class="brand__n">' + esc(T(b.name)) + "</span>" : "") +
        (b.partner ? '<span class="brand__s"></span><img class="brand__l" src="' + esc(IMG(b.partner)) +
          '" alt="' + esc(b.partnerAlt || "") + '">' : "") +
      "</a>" +
      '<button class="burger" aria-label="' + esc(T(C.ui.menu)) + '" aria-expanded="false"><i></i><i></i><i></i></button>' +
    "</header>"
  );
  app.appendChild(top);

  /* боковая панель */
  var U = C.ui;
  var panel = el(
    '<aside class="panel" aria-hidden="true">' +
      '<div class="panel__top"><span class="mono">' + esc(T(U.menu)) + "</span>" +
        '<button class="panel__x" aria-label="✕">✕</button></div>' +
      '<nav class="panel__nav">' + (C.nav || []).map(function (n) {
        return '<a href="' + esc(n.href) + '">' + esc(T(n.label)) + "</a>";
      }).join("") + "</nav>" +
      '<div class="panel__ctrls">' +
        (C.langSwitch === false ? "" :
          '<div class="ctrl"><span class="mono">' + esc(T(U.lang)) + "</span>" +
          '<span class="seg mono"><button data-lang="ru">РУС</button><button data-lang="en">ENG</button></span></div>') +
        '<div class="ctrl"><span class="mono">' + esc(T(U.theme)) + "</span>" +
          '<span class="seg mono"><button data-theme="light">' + esc(T(U.light)) + '</button>' +
          '<button data-theme="dark">' + esc(T(U.dark)) + "</button></span></div>" +
      "</div>" +
      '<div class="panel__ctrls panel__ctrls--b">' +
        '<button class="ctrl" data-act="top"><span class="mono">' + esc(T(U.top)) + "</span>" +
          '<span class="mono">' + esc(T(U.topGo)) + " ↑</span></button>" +
        '<button class="ctrl" data-act="full"><span class="mono">' + esc(T(U.full)) + "</span>" +
          '<span class="mono" data-full>' + esc(T(U.fullOn)) + " ⤢</span></button>" +
      "</div>" +
    "</aside>"
  );
  app.appendChild(el('<div class="scrim"></div>'));
  app.appendChild(panel);

  /* экраны; после первого — «разбег», если включён параллакс */
  (C.screens || []).forEach(function (s) {
    var fn = S[s.type];
    if (!fn) { console.warn("Неизвестный экран:", s.type); return; }
    app.appendChild(fn(s));
  });

  /* заглушка следующего экрана */
  if (C.next) {
    app.appendChild(el(
      '<section class="next" id="' + esc(C.next.id || "s2") + '" data-tone="light">' +
        '<div class="next__box"><b>' + esc(T(C.next.title)) + "</b>" +
        '<span class="mono">' + esc(T(C.next.note)) + "</span></div>" +
      "</section>"
    ));
  }

  /* ================================================================
     ПОДВАЛ — «Связаться»
     ================================================================ */
  var f = C.footer;
  if (f) {
    var cols = (f.columns || []).map(function (c) {
      return '<div class="foot__c"><h4 class="mono">' + esc(T(c.title)) + "</h4><ul>" +
        (c.items || []).map(function (i) {
          return '<li><a href="' + esc(i.href) + '"' + ext(i.href) + ">" + esc(T(i.label)) + "</a></li>";
        }).join("") + "</ul></div>";
    }).join("");
    var flinks = (f.contacts || []).map(function (c) {
      return '<a class="foot__link" href="' + esc(c.href) + '"' + ext(c.href) + ">" +
        esc(T(c.label)) + ' <i aria-hidden="true">↗</i></a>';
    }).join("");
    app.appendChild(el(
      '<footer class="foot" id="' + esc(f.id || "contact") + '" data-tone="deep"' +
        (f.bg ? ' style="--foot-bg:' + esc(f.bg) + '"' : "") + ">" +
        '<div class="wrap foot__top">' +
          '<h2 class="dsp">' + masked(f.title) + "</h2>" +
          '<div class="foot__links rv">' + flinks + "</div>" +
        "</div>" +
        '<div class="wrap"><div class="rule" style="margin-top:0"></div></div>' +
        '<div class="wrap foot__mid">' + cols +
          (T(f.address) ? '<div class="foot__addr mono">' + esc(T(f.address)) + "</div>" : "") +
        "</div>" +
        '<div class="wrap foot__bot mono">' +
          '<span class="foot__logo"><b>' + esc(T(b.name) || "") + "</b>" +
            (b.logo ? '<img src="' + esc(IMG(b.logo)) + '" alt="">' : "") + "</span>" +
          "<span>" + esc(T(f.copyright) || "") + "</span>" +
          '<span class="sp">' + esc(T(f.credit) || "") + "</span>" +
        "</div>" +
      "</footer>"
    ));
  }

  /* ================================================================
     ПОВЕДЕНИЕ
     ================================================================ */
  function sync() {
    panel.querySelectorAll("[data-lang]").forEach(function (n) { n.classList.toggle("on", n.dataset.lang === LANG); });
    panel.querySelectorAll("[data-theme]").forEach(function (n) { n.classList.toggle("on", n.dataset.theme === THEME); });
  }
  sync();

  function closePanel() {
    document.body.classList.remove("nav-open");
    top.querySelector(".burger").setAttribute("aria-expanded", "false");
    panel.setAttribute("aria-hidden", "true");
  }
  top.querySelector(".burger").addEventListener("click", function () {
    var o = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", o ? "true" : "false");
    panel.setAttribute("aria-hidden", o ? "false" : "true");
  });
  panel.querySelector(".panel__x").addEventListener("click", closePanel);
  app.querySelector(".scrim").addEventListener("click", closePanel);
  addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });

  panel.querySelectorAll("[data-lang]").forEach(function (n) {
    n.addEventListener("click", function () {
      if (n.dataset.lang === LANG) return;
      localStorage.setItem("site-lang", n.dataset.lang);
      cleanup(); __render();
    });
  });
  panel.querySelectorAll("[data-theme]").forEach(function (n) {
    n.addEventListener("click", function () {
      THEME = n.dataset.theme;
      localStorage.setItem("site-theme", THEME);
      document.documentElement.dataset.theme = THEME;
      sync();
    });
  });
  panel.querySelector('[data-act="top"]').addEventListener("click", function () {
    closePanel(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });
  var fullLabel = panel.querySelector("[data-full]");
  panel.querySelector('[data-act="full"]').addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  function fsSync() { fullLabel.textContent = document.fullscreenElement ? T(U.fullOff) + " ⤡" : T(U.fullOn) + " ⤢"; }
  document.addEventListener("fullscreenchange", fsSync); fsSync();

  app.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener("click", function (e) {
      var t = document.querySelector(a.getAttribute("href"));
      if (!t) return;
      e.preventDefault(); closePanel();
      scrollTo({ top: t.getBoundingClientRect().top + scrollY, behavior: reduce ? "auto" : "smooth" });
    });
  });

  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -10% 0px", threshold: .1 });
  app.querySelectorAll(".msk,.rv").forEach(function (n) { io.observe(n); });
  requestAnimationFrame(function () { app.querySelectorAll(".hero .msk").forEach(function (n) { n.classList.add("in"); }); });

  /* --- прокрутка ------------------------------------------- */
  var pbar = app.querySelector(".pbar");
  var stackBox = app.querySelector(".stack");
  var stackCards = [].slice.call(app.querySelectorAll(".card"));
  var focusBox = app.querySelector(".focus");
  var zoom = app.querySelector(".zoom");
  var zoomImg = app.querySelector(".zoom__f img");
  var zoomRing = app.querySelector(".zoom__ring");
  var focusCalls = [].slice.call(app.querySelectorAll(".call"));
  var focusCfg = (C.screens || []).filter(function (x) { return x.type === "focus"; })[0] || {};
  var focusPts = [{ x: 50, y: 50, s: 1 }].concat((focusCfg.items || []).map(function (it) {
    return { x: (it.at && it.at[0]) || 50, y: (it.at && it.at[1]) || 50, s: (it.at && it.at[2]) || 1.8 };
  }));

  /* точка на фото (в % от снимка) → точка в кадре с учётом кадрирования */
  function onFrame(pt, cw, ch) {
    var iw = zoomImg && zoomImg.naturalWidth, ih = zoomImg && zoomImg.naturalHeight;
    if (!iw || !ih || !cw || !ch) return pt;
    var fit = getComputedStyle(zoomImg).objectFit;
    var k = fit === "contain" ? Math.min(cw / iw, ch / ih) : Math.max(cw / iw, ch / ih);
    var dw = iw * k, dh = ih * k;
    return {
      x: Math.max(0, Math.min(100, ((pt.x / 100) * dw - (dw - cw) / 2) / cw * 100)),
      y: Math.max(0, Math.min(100, ((pt.y / 100) * dh - (dh - ch) / 2) / ch * 100)),
      s: pt.s
    };
  }
  var newsBox = app.querySelector(".news");
  var newsTrack = app.querySelector(".news__track");
  var newsProg = app.querySelector(".news__prog");

  var stepsRail = app.querySelector(".steps__rail");
  var stepsFill = app.querySelector(".steps__fill");
  var stepsLogo = app.querySelector(".steps__logo");
  var stepEls = [].slice.call(app.querySelectorAll(".step"));

  /* секции с пометкой data-tone: по ним шапка выбирает свой цвет */
  var toned = [].slice.call(app.querySelectorAll("[data-tone]"));

  var raf = 0;
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(v) { return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; }

  function frame() {
    raf = 0;
    var vh = innerHeight, doc = document.documentElement;
    pbar.style.setProperty("--p", (scrollY / Math.max(1, doc.scrollHeight - vh)).toFixed(4));

    /* тон шапки — по самой верхней секции под ней */
    for (var ti = toned.length - 1; ti >= 0; ti--) {
      var tr = toned[ti].getBoundingClientRect();
      if (tr.top <= 30 && tr.bottom > 30) {
        var deep = toned[ti].dataset.tone === "deep";
        top.classList.toggle("top--deep", deep);
        /* на тёмной секции линия прокрутки светлеет, иначе теряется */
        document.body.classList.toggle("tone-deep", deep);
        break;
      }
    }

    /* выноски: фото наезжает на детали, подписи появляются по очереди */
    if (focusBox && zoom) {
      var fr = focusBox.getBoundingClientRect();
      var fp = clamp(-fr.top / Math.max(1, fr.height - vh));
      var isPh = zoom.classList.contains("ph");
      if (!isPh) {
        var a = clamp(fp / .16);
        zoom.style.setProperty("--a", (.86 + .14 * ease(a)).toFixed(3));
        zoom.style.setProperty("--op", a.toFixed(3));
        var segs = Math.max(1, focusPts.length - 1);
        var q = clamp((fp - .16) / .72) * segs;
        var si = Math.min(segs - 1, Math.floor(q));
        var t = ease(clamp(q - si));
        var A2 = onFrame(focusPts[si], zoom.offsetWidth, zoom.offsetHeight);
        var B2 = onFrame(focusPts[si + 1], zoom.offsetWidth, zoom.offsetHeight);
        var dip = (A2.s > 1.2 && B2.s > 1.2) ? Math.sin(Math.PI * t) * .34 : 0;
        zoom.style.setProperty("--ox", (A2.x + (B2.x - A2.x) * t).toFixed(2) + "%");
        zoom.style.setProperty("--oy", (A2.y + (B2.y - A2.y) * t).toFixed(2) + "%");
        zoom.style.setProperty("--s", (A2.s + (B2.s - A2.s) * t - dip).toFixed(3));
        var idx = t > .62 ? si : si - 1;
        if (zoomRing) zoomRing.classList.toggle("on", idx >= 0);
        var vis = fr.top < vh * .5 && fr.bottom > vh * .5;
        focusCalls.forEach(function (c, j) { c.classList.toggle("on", vis && j <= idx); });
      } else {
        /* пустой слот: выноски просто появляются по очереди */
        var n = focusCalls.length, vis2 = fr.top < vh * .5 && fr.bottom > vh * .5;
        var k2 = Math.floor(clamp(fp / .9) * n * 1.05) - 1;
        focusCalls.forEach(function (c, j) { c.classList.toggle("on", vis2 && j <= k2); });
      }
    }

    /* карточки: каждая выезжает снизу на свою ступень */
    if (stackBox && stackCards.length) {
      if (reduce || innerWidth <= 820) {
        if (stackCards[0].style.transform) stackCards.forEach(function (c) { c.style.transform = ""; });
      } else {
        var kr = stackBox.getBoundingClientRect();
        var kp = clamp(-kr.top / Math.max(1, kr.height - vh)) * stackCards.length;
        stackCards.forEach(function (c, i) {
          var loc = ease(clamp(kp - i + 1));
          var slot = c.offsetTop;
          c.style.transform = "translate3d(0," + ((1 - loc) * Math.max(0, vh - slot)).toFixed(1) + "px,0)";
        });
      }
    }

    /* этапы: линия закрашивается, шаги зажигаются, знак поворачивается */
    if (stepsRail && stepsFill) {
      var sr = stepsRail.getBoundingClientRect();
      var sp = clamp((vh * .55 - sr.top) / Math.max(1, sr.height));
      stepsFill.style.setProperty("--p", sp.toFixed(4));
      if (stepsLogo) stepsLogo.style.setProperty("--r", (sp * 360).toFixed(1) + "deg");
      stepEls.forEach(function (n3) { n3.classList.toggle("on", n3.getBoundingClientRect().top < vh * .6); });
    }

    /* лента: прокрутка страницы двигает карточки по горизонтали */
    if (newsBox && newsTrack && !reduce && innerWidth > 820) {
      var nr = newsBox.getBoundingClientRect();
      var np = clamp(-nr.top / Math.max(1, nr.height - vh));
      var travel = Math.max(0, newsTrack.scrollWidth - innerWidth);
      newsTrack.style.transform = "translate3d(" + (-np * travel).toFixed(1) + "px,0,0)";
      if (newsProg) newsProg.style.setProperty("--p", np.toFixed(4));
    }
  }
  function onScroll() { if (!raf) raf = requestAnimationFrame(frame); }

  /* высота экрана с лентой = экран + путь, который проходят карточки */
  function sizeNews() {
    if (!newsBox || !newsTrack) return;
    if (innerWidth <= 820 || reduce) { newsBox.style.height = ""; newsTrack.style.transform = ""; return; }
    var travel = Math.max(0, newsTrack.scrollWidth - innerWidth);
    newsBox.style.height = (innerHeight + travel * 1.1) + "px";
  }

  addEventListener("scroll", onScroll, { passive: true });
  function onResize() { sizeNews(); onScroll(); }
  addEventListener("resize", onResize);
  sizeNews(); frame();

  /* снимаем обработчики перед пересборкой страницы (смена языка) */
  function cleanup() {
    removeEventListener("scroll", onScroll);
    removeEventListener("resize", onResize);
    document.removeEventListener("fullscreenchange", fsSync);
    io.disconnect();
    document.body.classList.remove("nav-open");
  }
}

/* ASSETS объявлены ниже по файлу — ждём разбора документа */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", __render);
else __render();

</script>

<!-- ===== 3. КАРТИНКИ ===== -->
<script>
/* ================================================================
   КАРТИНКИ. Вшиты в файл (data-URI) — страница работает офлайн.
   Свои файлы подставляются в конфиге путём: art: "assets/photo.jpg".
